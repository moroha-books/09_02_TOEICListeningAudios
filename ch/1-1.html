<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1-1 一人の人物の動作</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="ch-head wrap">
  <a class="back" href="../index.html">目次に戻る</a>
  <p class="ch-part">Part 1 写真描写問題</p>
  <h1><span class="ch-num">1-1</span>一人の人物の動作</h1>
  <p class="tip">動詞を聞き取る。写真に写っていない動作(これからする・終わった)を選ばない。</p>
</header>
<main class="wrap"><ol class="tracks"><li id="P1-001"><button class="track" data-index="0" type="button"><span class="t-label">No. 1</span><span class="t-id">P1-001</span></button></li><li id="P1-003"><button class="track" data-index="1" type="button"><span class="t-label">No. 2</span><span class="t-id">P1-003</span></button></li><li id="P1-004"><button class="track" data-index="2" type="button"><span class="t-label">No. 3</span><span class="t-id">P1-004</span></button></li><li id="P1-005"><button class="track" data-index="3" type="button"><span class="t-label">No. 4</span><span class="t-id">P1-005</span></button></li><li id="P1-006"><button class="track" data-index="4" type="button"><span class="t-label">No. 5</span><span class="t-id">P1-006</span></button></li><li id="P1-007"><button class="track" data-index="5" type="button"><span class="t-label">No. 6</span><span class="t-id">P1-007</span></button></li></ol></main>
<div class="player" aria-label="音声プレイヤー">
  <div class="now"><span id="now-label">トラックを選んでください</span><span id="time">0:00 / 0:00</span></div>
  <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="再生位置">
  <div class="controls">
    <button id="prev" type="button" aria-label="前のトラック">&#9198;</button>
    <button id="back5" type="button" aria-label="5秒戻る">-5秒</button>
    <button id="play" class="play" type="button" aria-label="再生">&#9654;</button>
    <button id="fwd5" type="button" aria-label="5秒進む">+5秒</button>
    <button id="next" type="button" aria-label="次のトラック">&#9197;</button>
  </div>
  <div class="options">
    <label class="opt">速さ
      <select id="speed">
        <option value="0.8">0.8</option><option value="0.9">0.9</option>
        <option value="1" selected>1.0</option><option value="1.1">1.1</option>
        <option value="1.25">1.25</option>
      </select>
    </label>
    <label class="opt"><input type="checkbox" id="slow"> ゆっくり</label>
    <label class="opt"><input type="checkbox" id="auto" checked> 連続再生</label>
    <label class="opt"><input type="checkbox" id="repeat"> くり返し</label>
  </div>
  <audio id="audio" preload="none"></audio>
</div>
<script>window.TRACKS = [{"label": "No. 1", "id": "P1-001", "normal": "../audio/part1/P1-001.mp3", "slow": "../audio_slow/part1/P1-001.mp3"}, {"label": "No. 2", "id": "P1-003", "normal": "../audio/part1/P1-003.mp3", "slow": "../audio_slow/part1/P1-003.mp3"}, {"label": "No. 3", "id": "P1-004", "normal": "../audio/part1/P1-004.mp3", "slow": "../audio_slow/part1/P1-004.mp3"}, {"label": "No. 4", "id": "P1-005", "normal": "../audio/part1/P1-005.mp3", "slow": "../audio_slow/part1/P1-005.mp3"}, {"label": "No. 5", "id": "P1-006", "normal": "../audio/part1/P1-006.mp3", "slow": "../audio_slow/part1/P1-006.mp3"}, {"label": "No. 6", "id": "P1-007", "normal": "../audio/part1/P1-007.mp3", "slow": "../audio_slow/part1/P1-007.mp3"}];</script>
<script src="../assets/player.js"></script>

</html>
