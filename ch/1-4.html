<header class="ch-head wrap">

<main class="wrap"><ol class="tracks"><li id="P1-018"><button class="track" data-index="0" type="button"><span class="t-label">No. 18</span><span class="t-id">P1-018</span></button></li><li id="P1-019"><button class="track" data-index="1" type="button"><span class="t-label">No. 19</span><span class="t-id">P1-019</span></button></li><li id="P1-020"><button class="track" data-index="2" type="button"><span class="t-label">No. 20</span><span class="t-id">P1-020</span></button></li></ol></main>

    <label class="opt"><input type="checkbox" id="auto" checked> 連続再生</label>
