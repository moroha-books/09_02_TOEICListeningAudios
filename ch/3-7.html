<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3-7 図表問題</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="ch-head wrap">
  <a class="back" href="../index.html">目次に戻る</a>
  <p class="ch-part">Part 3 会話問題</p>
  <h1><span class="ch-num">3-7</span>図表問題</h1>
  <p class="tip">選択肢に並ぶ情報ではなく、図表の「もう一方の列」が音声で読まれる。</p>
</header>
<main class="wrap"><ol class="tracks"><li id="P3-02"><button class="track" data-index="0" type="button"><span class="t-label">No. 88–90</span><span class="t-id">P3-02</span></button></li><li id="P3-31"><button class="track" data-index="1" type="button"><span class="t-label">No. 91–93</span><span class="t-id">P3-31</span></button></li><li id="P3-32"><button class="track" data-index="2" type="button"><span class="t-label">No. 94–96</span><span class="t-id">P3-32</span></button></li><li id="P3-33"><button class="track" data-index="3" type="button"><span class="t-label">No. 97–99</span><span class="t-id">P3-33</span></button></li><li id="P3-34"><button class="track" data-index="4" type="button"><span class="t-label">No. 100–102</span><span class="t-id">P3-34</span></button></li></ol></main>
<div class="player" aria-label="音声プレイヤー">
  <div class="now"><span id="now-label">トラックを選んでください</span><span id="time">0:00 / 0:00</span></div>
  <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="再生位置">
  <div class="controls">
    <button id="prev" type="button" aria-label="前のトラック">&#9198;</button>
    <button id="back5" type="button" aria-label="5秒戻る">-5秒</button>
    <button id="play" class="play" type="button" aria-label="再生">&#9654;</button>
    <button id="fwd5" type="button" aria-label="5秒進む">+5秒</button>
    <button id="next" type="button" aria-label="次のトラック">&#9197;</button>
  </div>
  <div class="options">
    <label class="opt">速さ
      <select id="speed">
        <option value="0.8">0.8</option><option value="0.9">0.9</option>
        <option value="1" selected>1.0</option><option value="1.1">1.1</option>
        <option value="1.25">1.25</option>
      </select>
    </label>
    <label class="opt"><input type="checkbox" id="slow"> ゆっくり</label>
    <label class="opt"><input type="checkbox" id="auto" checked> 連続再生</label>
    <label class="opt"><input type="checkbox" id="repeat"> くり返し</label>
  </div>
  <audio id="audio" preload="none"></audio>
</div>
<script>window.TRACKS = [{"label": "No. 88–90", "id": "P3-02", "normal": "../audio/part3/P3-02.mp3", "slow": "../audio_slow/part3/P3-02.mp3"}, {"label": "No. 91–93", "id": "P3-31", "normal": "../audio/part3/P3-31.mp3", "slow": "../audio_slow/part3/P3-31.mp3"}, {"label": "No. 94–96", "id": "P3-32", "normal": "../audio/part3/P3-32.mp3", "slow": "../audio_slow/part3/P3-32.mp3"}, {"label": "No. 97–99", "id": "P3-33", "normal": "../audio/part3/P3-33.mp3", "slow": "../audio_slow/part3/P3-33.mp3"}, {"label": "No. 100–102", "id": "P3-34", "normal": "../audio/part3/P3-34.mp3", "slow": "../audio_slow/part3/P3-34.mp3"}];</script>
<script src="../assets/player.js"></script>
