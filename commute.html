<script>window.COMMUTE = [{"id": "3-1", "part": 3, "title": "言い換えを見抜く", "minutes": 19.5, "markers": [{"t": 7.8, "label": "No. 1–3", "summary": "4階のコピー機が何度も紙詰まりを起こしていますが、技術者は3時まで来られません。"}, {"t": 194.7, "label": "No. 4–6", "summary": "男性は両親の結婚40周年のお祝いに12人の席を予約したいと言い、女性は追加料金なしで使える個室を勧めます。"}, {"t": 414.7, "label": "No. 7–9", "summary": "男性はチームを率いる仕事がしたくて転職を考えています。"}, {"t": 609.6, "label": "No. 10–12", "summary": "男性は先週買ったノートパソコン用のバッグの肩ひもが切れたと言い、同じバッグではなく返金を求めます。"}, {"t": 777.1, "label": "No. 13–15", "summary": "来月の営業会議の準備は順調ですが、仕出し業者が値上げをしたため予算を超えそうです。"}, {"t": 958.4, "label": "No. 16–18", "summary": "男性は上司が会議を入れたため、明日の検診の予約を木曜日に変更します。"}], "src": "commute/ch_3-1.mp3"}, {"id": "3-2", "part": 3, "title": "単語ひっかけ", "minutes": 13.0, "markers": [{"t": 7.3, "label": "No. 19–21", "summary": "新しい書類棚を運ぶトラックが故障し、届くのは金曜日になります。"}, {"t": 195.6, "label": "No. 22–24", "summary": "男性は飲み物を注文したついでに、アルバイトの求人について尋ねます。"}, {"t": 400.4, "label": "No. 25–27", "summary": "新しいプロジェクト管理ソフトの使い方がわかりにくく、IT部が研修を開きます。"}, {"t": 592.1, "label": "No. 28–30", "summary": "恐竜展の今日のチケットは売り切れていて、女性は明日の朝には帰ってしまいます。"}], "src": "commute/ch_3-2.mp3"}, {"id": "3-3", "part": 3, "title": "否定・訂正トラップ", "minutes": 16.5, "markers": [{"t": 8.4, "label": "No. 31–33", "summary": "男性は会社のボランティアの日に申し込んでいません。"}, {"t": 185.3, "label": "No. 34–36", "summary": "広告では5月1日からの入居でしたが、実際は4月15日から入れます。"}, {"t": 393.9, "label": "No. 37–39", "summary": "マーケティング報告書の締め切りが、顧客アンケートの結果を入れるために延びました。"}, {"t": 579.5, "label": "No. 40–42", "summary": "女性は大学に入ったおいへのプレゼントに、持ち運びのできるスピーカーを探しています。"}, {"t": 769.3, "label": "No. 43–45", "summary": "男性は道路工事を避けるため、会議には車ではなく電車で行くことにしました。"}], "src": "commute/ch_3-3.mp3"}, {"id": "3-4", "part": 3, "title": "問題・理由の設問", "minutes": 13.1, "markers": [{"t": 8.3, "label": "No. 46–48", "summary": "嵐のため魚が届かず、今夜はメニューが減っています。"}, {"t": 185.5, "label": "No. 49–51", "summary": "男性はアカウントにログインできません。"}, {"t": 391.7, "label": "No. 52–54", "summary": "女性はパレードのためバスのルートが変わり、遅刻しました。"}, {"t": 582.0, "label": "No. 55–57", "summary": "新しいランニングシューズの売上が予想より低い原因は、値段ではなくサイズが小さめなことでした。"}], "src": "commute/ch_3-4.mp3"}, {"id": "3-5", "part": 3, "title": "意図問題", "minutes": 17.4, "markers": [{"t": 7.2, "label": "No. 58–60", "summary": "午後に予定している取引先へのプレゼンの準備について話しています。"}, {"t": 183.8, "label": "No. 61–63", "summary": "男性はプレゼンのスライドを見てほしいと頼みますが、女性はもうすぐ空港へ出発します。"}, {"t": 337.5, "label": "No. 64–66", "summary": "会社が男性の家のすぐ近くに新しい支店を開きます。"}, {"t": 519.1, "label": "No. 67–69", "summary": "見本市のパンフレットの電話番号に誤りが見つかりますが、もう500部印刷してしまいました。"}, {"t": 686.6, "label": "No. 70–72", "summary": "社員食堂は新しいメニューのせいで長い列ができています。"}, {"t": 852.8, "label": "No. 73–75", "summary": "伊藤さんは明日、ソウルから来るお客様の工場見学を案内します。"}], "src": "commute/ch_3-5.mp3"}, {"id": "3-6", "part": 3, "title": "3人の会話", "minutes": 16.0, "markers": [{"t": 7.8, "label": "No. 76–78", "summary": "部署の引っ越しに向けて座席を決めています。"}, {"t": 227.9, "label": "No. 79–81", "summary": "男性の部屋が予約した港の見える部屋ではありませんでした。"}, {"t": 461.6, "label": "No. 82–84", "summary": "園芸クラブの女性二人が、植物の販売会のために大ホールを借りたいと相談します。"}, {"t": 709.2, "label": "No. 85–87", "summary": "客席のエアコンが故障し、修理業者のトニーと技術者のヒロシが来ます。"}], "src": "commute/ch_3-6.mp3"}, {"id": "3-7", "part": 3, "title": "図表問題", "minutes": 16.6, "markers": [{"t": 7.5, "label": "No. 88–90", "summary": "客は中央駅へ行くシャトルバスについて尋ねますが、9時40分の便は運休です。"}, {"t": 222.1, "label": "No. 91–93", "summary": "女性は開業したばかりの会計事務所の名刺を注文します。"}, {"t": 433.2, "label": "No. 94–96", "summary": "客へのアンケートで一番多かったネット注文はすでに準備中なので、2番目に多かった営業時間の延長に取り組むことにします。"}, {"t": 629.3, "label": "No. 97–99", "summary": "男性は安全研修に来ましたが、301号室はプロジェクターが動かないため、廊下を挟んだ真向かいの部屋に変更になっています。"}, {"t": 798.8, "label": "No. 100–102", "summary": "動画広告を始めた月に、ウェブサイトの訪問者数が急に増えました。"}], "src": "commute/ch_3-7.mp3"}, {"id": "4-1", "part": 4, "title": "電話メッセージ", "minutes": 16.7, "markers": [{"t": 7.7, "label": "No. 1–3", "summary": "注文された椅子が在庫切れのため、色違いで少し安い、よく似たモデルを提案しています。"}, {"t": 203.7, "label": "No. 4–6", "summary": "ブレーキの交換が終わったことと、前のタイヤがすり減っていることを伝え、今日は早く閉店すると知らせています。"}, {"t": 402.4, "label": "No. 7–9", "summary": "帰りの便が欠航になったため、土曜日の製品の実演を、経験のあるソフィーに代わってほしいと頼んでいます。"}, {"t": 598.0, "label": "No. 10–12", "summary": "注文したテーブルの入荷が遅れるため、別の素材のものに変えればクッションを無料で付けると提案しています。"}, {"t": 791.4, "label": "No. 13–15", "summary": "会社の表彰夕食会の人数が多いため、もっと広い部屋を予約したと伝えています。"}], "src": "commute/ch_4-1.mp3"}, {"id": "4-2", "part": 4, "title": "アナウンス・案内", "minutes": 16.9, "markers": [{"t": 7.7, "label": "No. 16–18", "summary": "バンクーバー行きの便のゲートと出発時刻が変わり、お詫びに無料の飲み物の引換券を配ると知らせています。"}, {"t": 197.4, "label": "No. 19–21", "summary": "冷凍食品のセール、日曜日の休業、ポイントカードの申し込みについて案内しています。"}, {"t": 408.2, "label": "No. 22–24", "summary": "ガイドが見学の流れと注意事項を説明し、最後にお土産がもらえると伝えています。"}, {"t": 605.4, "label": "No. 25–27", "summary": "線路の保守作業のため、今日はミルブルック駅に停車しないことと、荷物の置き場所について案内しています。"}, {"t": 795.4, "label": "No. 28–30", "summary": "基調講演が11時に変更になったことと、昼食の場所、アンケートを出すと抽選に参加できることを伝えています。"}], "src": "commute/ch_4-2.mp3"}, {"id": "4-3", "part": 4, "title": "会議・社内連絡", "minutes": 17.5, "markers": [{"t": 8.1, "label": "No. 31–33", "summary": "来月から出張経費の申請が新しいアプリに変わることを説明し、実演に領収書を持ってくるよう頼んでいます。"}, {"t": 214.6, "label": "No. 34–36", "summary": "来月の改装の進め方を説明し、追加で働ける人は予定表に名前を書くよう頼んでいます。"}, {"t": 429.0, "label": "No. 37–39", "summary": "駐車場の工事の間、市営駐車場に無料で停められることと、シャトルバンが運行することを伝えています。"}, {"t": 640.1, "label": "No. 40–42", "summary": "新しいスポーツドリンクの試飲結果を伝え、ラベルの案を見て意見を送るよう頼んでいます。"}, {"t": 831.1, "label": "No. 43–45", "summary": "新しく加わったケビンを紹介し、来週からサポート時間が延びるので、シフト表を確認するよう頼んでいます。"}], "src": "commute/ch_4-3.mp3"}, {"id": "4-4", "part": 4, "title": "広告・ラジオ・ニュース", "minutes": 14.1, "markers": [{"t": 8.5, "label": "No. 46–48", "summary": "市議会がマーケット通りを日中は歩行者専用にすることを決め、木曜日に説明会が開かれると伝えています。"}, {"t": 226.4, "label": "No. 49–51", "summary": "他社と違って長期契約がいらないことや、初回が半額になることを宣伝しています。"}, {"t": 433.7, "label": "No. 52–54", "summary": "司会者が、急成長した会社の創業者をゲストとして紹介し、まず交通情報を流します。"}, {"t": 641.4, "label": "No. 55–57", "summary": "週末の食のお祭りについて、大雨のため料理コンテストの会場が変わったことと、無料シャトルバスの利用を案内しています。"}], "src": "commute/ch_4-4.mp3"}, {"id": "4-5", "part": 4, "title": "意図問題", "minutes": 18.4, "markers": [{"t": 7.1, "label": "No. 58–60", "summary": "同じ時間に配達が2件重なっていますが、車は1台しかありません。"}, {"t": 222.5, "label": "No. 61–63", "summary": "休憩中に、次の目的地の灯台はそれほど遠くないと励まし、出発前に水を補充するよう頼んでいます。"}, {"t": 437.4, "label": "No. 64–66", "summary": "新しい児童書のシリーズの絵を、ぜひ担当してほしいと頼んでいます。"}, {"t": 662.0, "label": "No. 67–69", "summary": "経験豊富なので困ったら助けると安心させ、来週の絵付けの回は開始時間が遅くなると知らせています。"}, {"t": 870.3, "label": "No. 70–72", "summary": "配達の遅さは新しい物流センターで改善され、今の課題は返品の手続きだと説明し、アナに改善案を頼んでいます。"}], "src": "commute/ch_4-5.mp3"}, {"id": "4-6", "part": 4, "title": "図表問題", "minutes": 16.3, "markers": [{"t": 7.5, "label": "No. 73–75", "summary": "予約が一番少ないクラスを朝の時間帯に移すことにして、会員にその変更を伝えるよう頼んでいます。"}, {"t": 198.1, "label": "No. 76–78", "summary": "1時のツアーが中止になったため、予約していた人は次の英語のツアーに参加できると伝えています。"}, {"t": 384.2, "label": "No. 79–81", "summary": "インクはもう注文済みなので、受付エリアの椅子を注文することにして、モニカに寸法を測るよう頼んでいます。"}, {"t": 584.4, "label": "No. 82–84", "summary": "電源の問題でブースがカフェの隣に移ったことを伝え、展示用の箱を運ぶよう頼んでいます。"}, {"t": 758.9, "label": "No. 85–87", "summary": "金曜日のための受付係を雇うことと、スタッフ研修を待ち時間の一番短い曜日に行うことを伝えています。"}], "src": "commute/ch_4-6.mp3"}, {"id": "4-7", "part": 4, "title": "長い説明の後の依頼", "minutes": 16.1, "markers": [{"t": 8.3, "label": "No. 88–90", "summary": "新しい顧客データベースの機能を説明し、始める前に仮のパスワードでログインするよう頼んでいます。"}, {"t": 253.5, "label": "No. 91–93", "summary": "給水ポンプの交換で断水することを伝え、機械室の前に物を置かないよう頼んでいます。"}, {"t": 488.8, "label": "No. 94–96", "summary": "仕事の内容や休憩の取り方を伝え、子どもたちに保護眼鏡をかけさせるよう頼んでいます。"}, {"t": 729.4, "label": "No. 97–99", "summary": "先週末のお礼と新しい予約システムについて伝え、当面はデザートのおすすめを口頭で説明するよう頼んでいます。"}], "src": "commute/ch_4-7.mp3"}]; window.BOOK_TITLE = "ワナが見える! TOEIC® L&R リスニング 設問タイプ別ドリル";</script>
